<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoodFusion</title>
    <style>
      body {
        margin: 0px;
        text-align: center;
        font-family: "Courier New", Courier, monospace;
      }
      #nav {
        display: flex;
        justify-content: right;
      }
      .link {
        padding: 10px;
        transition: transform 1s;
      }
      .link:hover {
        transform: scale(1.3);
      }
      .link:active {
        background-color: rgb(57, 167, 223);
        border-radius: 20%;
      }
      a {
        text-decoration: none;
        color: white;
      }
      #head {
        background-color: black;
        color: white;

        font-weight: bolder;
      }
      marquee {
        margin-top: 30px;
      }
      footer {
        text-align: center;
        background-color: black;
        padding: 20px;
        color: white;
      }
      main {
        min-height: 100vh;
        background:
          linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)),
          url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQvIql6tRWdOQE7Xx5Pb5gWl1wvdkJ2YEl-lqqi5SBpcQ&s=10")
            center/cover no-repeat;
      }
      form {
        background-color: white;
        height: 350px;
        width: 500px;
        text-align: left;
        margin-top: 100px;
        padding: 30px;
        font-family:
          "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
        border-radius: 10px;
      }
      label {
        font-size: 20px;
      }
      input {
        width: 90%;
        margin: 10px;
        padding: 10px;
      }

      #art1 {
        display: flex;
        justify-content: center;
      }
      #bt2 {
        text-align: center;
        width: 80%;
        margin-left: 50px;
        margin-top: 20px;
        padding: 15px;
        margin-bottom: 10px;
        background-color: rgb(236, 109, 62);
        color: white;
        border: none;
        border-radius: 5px;
        font-size: large;
        transition: transform 1s;
      }
      #bt2:hover {
        transform: scale(1.1);
      }
      #p1 {
        text-align: center;
      }
      #a1 {
        color: rgb(24, 42, 177);
      }
      #f-head {
        margin-bottom: 30px;
        margin-top: 10px;
        text-align: center;
        color: rgb(189, 65, 20);
      }
    </style>
  </head>
  <body>
    <header id="head">
      <nav id="nav">
        <marquee behavior="" direction="">
          Order Now To Get Buy 1 Get 1 Free Food
        </marquee>
        <p class="link"><a href="./index.html">Home</a></p>
        <p class="link"><a href="./food-section.html">FOOD SECTION</a></p>
        <p class="link"><a href="./orders.html">ORDERS</a></p>
        <p class="link"><a href="./login.html">LOG-IN</a></p>
      </nav>
    </header>
    <main>
      <article id="art1">
        .

        <form action="">
          <h2 id="f-head">Login Form</h2>
          <label for="">Email :</label>
          <input type="email" placeholder="email" required /><br />
          <label for="">Password :</label>
          <input type="password" placeholder="password" required /><br />
          <button id="bt2">Submit</button><br />

          <p id="p1">
            Don't have an account? <a id="a1" href="./login2.html">Sign Up</a>
          </p>
        </form>
      </article>
    </main>
    <footer>Copy Rights Puchased By Amar</footer>
  </body>
</html>
